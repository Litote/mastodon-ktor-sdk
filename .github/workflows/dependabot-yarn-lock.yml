name: Update Kotlin yarn lock

on:
  pull_request_target:
    branches: [ main ]
    paths:
      - 'gradle/libs.versions.toml'

jobs:
  # A version bump is a code change: this job runs the code of the new versions, as soon as
  # the pull request opens and before any review. So it has no secret and no write access:
  # the commit job holds the GitHub App token and executes nothing from this one.
  update-yarn-lock:
    name: Regenerate Kotlin yarn lock
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      # Checkout the base branch to avoid executing the build scripts of the pull request.
      # Only the version catalog is then taken from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.base_ref }}

      - name: Apply Dependabot version changes
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin "$HEAD_SHA"
          git checkout FETCH_HEAD -- gradle/libs.versions.toml

      - uses: Litote/ci/.github/actions/setup-gradle@c111317515db0963d8dfebb7821cefbc92d34897 # v0.9.0
        with:
          # Jobs that hold secrets restore this cache. GitHub already gives this event
          # read-only access to it.
          cache-read-only: 'true'

      # kotlinUpgradeYarnLock starts from the stored locks (kotlinRestoreYarnLock) and keeps
      # their resolved versions, so transitive security fixes would never be picked up.
      # Removing the locks forces a full resolution.
      # Dependency verification is disabled: this job only pulls libs.versions.toml from the PR,
      # not the verification metadata owned by the gradle-verification workflow.
      - name: Regenerate Kotlin yarn lock
        run: |
          rm -f kotlin-js-store/yarn.lock kotlin-js-store/wasm/yarn.lock
          ./gradlew kotlinUpgradeYarnLock kotlinWasmUpgradeYarnLock -PappleTargets=false --dependency-verification off

      - uses: Litote/ci/.github/actions/upload-regenerated-files@c111317515db0963d8dfebb7821cefbc92d34897 # v0.9.0
        with:
          paths: kotlin-js-store/yarn.lock kotlin-js-store/wasm/yarn.lock

  commit-yarn-lock:
    name: Commit Kotlin yarn lock
    needs: update-yarn-lock
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository
    # Every workflow that commits to a Dependabot branch uses this group: two commits in parallel
    # make the second ref update fail with "Update is not a fast forward". `queue: max` keeps
    # every pending job instead of replacing it.
    concurrency:
      group: dependabot-branch-update-${{ github.head_ref }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.base_ref }}

      # Only the index moves to the PR head: commit-via-api sees the changes relative to it,
      # and this job, which holds the App token, keeps the files of the PR off the disk.
      - name: Compare with the pull request head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --depth 1 origin "$HEAD_SHA"
          git reset --quiet FETCH_HEAD

      - uses: Litote/ci/.github/actions/apply-regenerated-files@c111317515db0963d8dfebb7821cefbc92d34897 # v0.9.0
        with:
          paths: kotlin-js-store/yarn.lock kotlin-js-store/wasm/yarn.lock

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - uses: Litote/ci/.github/actions/commit-via-api@c111317515db0963d8dfebb7821cefbc92d34897 # v0.9.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ github.head_ref }}
          paths: kotlin-js-store/yarn.lock kotlin-js-store/wasm/yarn.lock
          message: 'chore: update Kotlin yarn lock'
          expected-head: ${{ github.event.pull_request.head.sha }}
