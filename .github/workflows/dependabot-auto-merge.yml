name: Dependabot auto-merge

on:
  # pull_request_target gives access to the GitHub App secrets, which pull_request
  # events from Dependabot do not. No PR code is checked out or executed here.
  pull_request_target: # zizmor: ignore[dangerous-triggers] checks out nothing
    branches: [ main ]
    types: [ opened, reopened ]

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: read
    uses: Litote/ci/.github/workflows/dependabot-auto-merge.yml@de40fbf39509c6fa5816a9f2a5991af658aacc66 # v0.16.0
    with:
      ecosystems: gradle
      # Gradle plugins and the build tools run in the build without being called: they stay manual.
      # The generator also changes the generated clients and the public API of :sdk:api:
      # the diff is reviewed and the release type chosen when merging.
      exclude-dependencies: >-
        com.gradleup.shadow*,
        org.jetbrains.dokka*,
        dokka,
        shadow,
        org.litote.openapi.ktor.client.generator*
    secrets:
      RELEASE_PLEASE_APP_ID: ${{ secrets.RELEASE_PLEASE_APP_ID }}
      RELEASE_PLEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
