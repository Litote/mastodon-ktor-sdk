name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    uses: Litote/ci/.github/workflows/pr-title.yml@510461dc1f569a7c12735a6cad12e88a6cb533ad # v0.10.0

  check:
    permissions:
      contents: read
    uses: Litote/ci/.github/workflows/gradle-check.yml@510461dc1f569a7c12735a6cad12e88a6cb533ad # v0.10.0
    with:
      check-name: Check (JVM / JS / Linux)
      jvm-args: -Xmx3g -Dfile.encoding=UTF-8
      warm-up-tasks: :convention:assemble
      gradle-args: --max-workers=2 -PappleTargets=false
      macos-tasks: macosArm64Test iosSimulatorArm64Test compileKotlinIosArm64
      macos-jvm-args: -Xmx10g -Dfile.encoding=UTF-8
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Called on every pull request: a required check of a job skipped here would stay pending
  commit-guard:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: Litote/ci/.github/workflows/dependabot-commit-guard.yml@510461dc1f569a7c12735a6cad12e88a6cb533ad # v0.10.0
    with:
      allowed-paths: ^(gradle/verification-metadata\.xml|kotlin-js-store/(wasm/)?yarn\.lock)$
