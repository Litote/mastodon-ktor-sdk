name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    uses: Litote/ci/.github/workflows/pr-title.yml@b9071d15015f6816259c2170baae5aed063414a8 # v0.1.0

  check:
    permissions:
      contents: read
    uses: Litote/ci/.github/workflows/gradle-check.yml@fbeb51096c741360965275ed62a9011598259013 # v0.2.0
    with:
      check-name: Check (JVM / JS / Linux)
      jvm-args: -Xmx3g -Dfile.encoding=UTF-8
      warm-up-tasks: :convention:assemble
      gradle-args: --max-workers=2 -PappleTargets=false
      macos-tasks: macosArm64Test iosSimulatorArm64Test compileKotlinIosArm64
      macos-jvm-args: -Xmx10g -Dfile.encoding=UTF-8
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
