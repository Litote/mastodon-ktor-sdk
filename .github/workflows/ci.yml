name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    uses: Litote/ci/.github/workflows/pr-title.yml@de40fbf39509c6fa5816a9f2a5991af658aacc66 # v0.16.0

  check:
    permissions:
      contents: read
    uses: Litote/ci/.github/workflows/gradle-check.yml@de40fbf39509c6fa5816a9f2a5991af658aacc66 # v0.16.0
    with:
      check-name: Check (JVM / JS / Linux)
      jvm-args: -Xmx3g -Dfile.encoding=UTF-8
      warm-up-tasks: :convention:assemble
      # checkKotlinAbi on macOS only: without the Apple targets, the klib dumps would lose them
      gradle-args: --max-workers=2 -PappleTargets=false -x checkKotlinAbi
      macos-tasks: macosArm64Test iosSimulatorArm64Test compileKotlinIosArm64 checkKotlinAbi
      macos-jvm-args: -Xmx10g -Dfile.encoding=UTF-8
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # Called on every pull request: a required check of a job skipped here would stay pending
  commit-guard:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: Litote/ci/.github/workflows/dependabot-commit-guard.yml@de40fbf39509c6fa5816a9f2a5991af658aacc66 # v0.16.0
    with:
      allowed-paths: ^(gradle/verification-metadata\.xml|kotlin-js-store/(wasm/)?yarn\.lock|client/.*|sdk/api/build/.*|([^/]+/)*api/([^/]+/)*[^/]+\.api)$
