name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-title:
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    uses: Litote/ci/.github/workflows/pr-title.yml@5f7a96295fbcd88179faba3ac78685a78b7b6c84 # v0.8.1

  check:
    permissions:
      contents: read
    uses: Litote/ci/.github/workflows/gradle-check.yml@5f7a96295fbcd88179faba3ac78685a78b7b6c84 # v0.8.1
    with:
      check-name: Check (JVM / JS / Linux)
      jvm-args: -Xmx3g -Dfile.encoding=UTF-8
      warm-up-tasks: :convention:assemble
      gradle-args: --max-workers=2 -PappleTargets=false
      macos-tasks: macosArm64Test iosSimulatorArm64Test compileKotlinIosArm64
      macos-jvm-args: -Xmx10g -Dfile.encoding=UTF-8
    secrets:
      GRADLE_ENCRYPTION_KEY: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
