name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release manually (e.g. v0.3.0)'
        required: true
        type: string
      docs_only:
        description: 'Only (re)publish the KDoc of the tag, skip Maven Central and GitHub release jobs'
        required: false
        type: boolean
        default: false

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release-please.outputs.release_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release-please
        if: github.event_name == 'push'
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish ${{ needs.release-please.outputs.tag_name || inputs.tag }} (JVM / JS / Linux)
    runs-on: ubuntu-latest
    needs: release-please
    if: (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') && !inputs.docs_only
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          dependency-graph: disabled
          build-scan-publish: false
          cache-cleanup: never

      - name: Extract release version
        env:
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          sed -i "s/^VERSION_NAME=.*/VERSION_NAME=${VERSION}/" gradle.properties
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8/' gradle.properties

      - name: Warm up convention build
        run: ./gradlew :convention:assemble --no-configuration-cache

      - name: Build & test
        run: ./gradlew check

      - name: Jacoco aggregated report
        run: ./gradlew jacocoAggregatedReport --no-configuration-cache

      - name: SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --no-configuration-cache

      - name: SonarCloud quality gate
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonarCheck --no-configuration-cache

      # Publishes JVM, JS, WASM, Linux, Windows, and KotlinMultiplatform metadata.
      # Apple targets are excluded here and handled by the publish-macos job.
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: >
          ./gradlew publishAndReleaseToMavenCentral
          --max-workers=8
          -x publishMacosArm64PublicationToMavenCentralRepository
          -x publishIosArm64PublicationToMavenCentralRepository
          -x publishIosSimulatorArm64PublicationToMavenCentralRepository

      - name: Publish to Gradle Plugin Portal
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew publishPlugins

      - name: Build CLI & MCP Server fat JARs and native binaries (Linux / Windows)
        run: >
          ./gradlew
          :cli:shadowJar
          :cli:linkReleaseExecutableLinuxX64
          :cli:linkReleaseExecutableLinuxArm64
          :cli:linkReleaseExecutableMingwX64
          :mcp-server:shadowJar
          :mcp-server:linkReleaseExecutableLinuxX64
          :mcp-server:linkReleaseExecutableLinuxArm64
          :mcp-server:linkReleaseExecutableMingwX64

      - name: Upload CLI artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: |
          cp cli/build/bin/linuxX64/releaseExecutable/mastodon-cli.kexe mastodon-cli-linux-x64
          cp cli/build/bin/linuxArm64/releaseExecutable/mastodon-cli.kexe mastodon-cli-linux-arm64
          cp cli/build/bin/mingwX64/releaseExecutable/mastodon-cli.exe mastodon-cli-windows-x64.exe
          gh release upload "$TAG" \
            cli/build/libs/mastodon-cli-*.jar \
            mastodon-cli-linux-x64 \
            mastodon-cli-linux-arm64 \
            mastodon-cli-windows-x64.exe \
            --clobber

      - name: Upload MCP Server artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: |
          cp mcp-server/build/bin/linuxX64/releaseExecutable/mcp-server.kexe mastodon-mcp-server-linux-x64
          cp mcp-server/build/bin/linuxArm64/releaseExecutable/mcp-server.kexe mastodon-mcp-server-linux-arm64
          cp mcp-server/build/bin/mingwX64/releaseExecutable/mcp-server.exe mastodon-mcp-server-windows-x64.exe
          gh release upload "$TAG" \
            mcp-server/build/libs/mastodon-mcp-server-*.jar \
            mastodon-mcp-server-linux-x64 \
            mastodon-mcp-server-linux-arm64 \
            mastodon-mcp-server-windows-x64.exe \
            --clobber

  publish-macos:
    name: Publish ${{ needs.release-please.outputs.tag_name || inputs.tag }} (Apple)
    runs-on: macos-latest
    needs: [release-please, publish]
    if: (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') && !inputs.docs_only
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          dependency-graph: disabled
          build-scan-publish: false
          cache-cleanup: never

      - name: Extract release version
        env:
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          sed -i "" "s/^VERSION_NAME=.*/VERSION_NAME=${VERSION}/" gradle.properties
          sed -i "" 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8/' gradle.properties

      - name: Warm up convention build
        run: ./gradlew :convention:assemble --no-configuration-cache

      # Publishes only Apple targets (macOS, iOS) of the SDK modules.
      # Generated clients under client/ are not published (Maven Central publishing limits).
      # JVM / JS / WASM / Linux / Windows / KotlinMultiplatform metadata are handled by the publish job.
      - name: Publish Apple targets to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
        run: >
          ./gradlew
          :sdk:api:publishAndReleaseToMavenCentral
          :sdk:configuration:publishAndReleaseToMavenCentral
          :sdk:send:publishAndReleaseToMavenCentral
          :sdk:read:publishAndReleaseToMavenCentral
          --no-configuration-cache
          --max-workers=4
          -x publishJvmPublicationToMavenCentralRepository
          -x publishJsPublicationToMavenCentralRepository
          -x publishWasmJsPublicationToMavenCentralRepository
          -x publishLinuxX64PublicationToMavenCentralRepository
          -x publishLinuxArm64PublicationToMavenCentralRepository
          -x publishMingwX64PublicationToMavenCentralRepository
          -x publishKotlinMultiplatformPublicationToMavenCentralRepository

      - name: Build CLI & MCP Server native binaries (macOS ARM64)
        run: ./gradlew :cli:linkReleaseExecutableMacosArm64 :mcp-server:linkReleaseExecutableMacosArm64

      - name: Upload CLI & MCP Server macOS binaries to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: |
          cp cli/build/bin/macosArm64/releaseExecutable/mastodon-cli.kexe mastodon-cli-macos-arm64
          cp mcp-server/build/bin/macosArm64/releaseExecutable/mcp-server.kexe mastodon-mcp-server-macos-arm64
          gh release upload "$TAG" mastodon-cli-macos-arm64 mastodon-mcp-server-macos-arm64 --clobber

  finalize-release:
    name: Publish GitHub Release ${{ needs.release-please.outputs.tag_name || inputs.tag }}
    runs-on: ubuntu-latest
    # Releases are created as drafts (see release-please-config.json) because the repository
    # enforces immutable releases: assets can only be uploaded before the release is published.
    needs: [release-please, publish, publish-macos]
    if: (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') && !inputs.docs_only
    permissions:
      contents: write

    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest

  docs:
    name: Publish KDoc to GitHub Pages
    runs-on: ubuntu-latest
    # Not chained to the Maven Central jobs: a publication failure must not block the documentation.
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          dependency-graph: disabled
          build-scan-publish: false
          cache-cleanup: never

      - name: Extract release version
        env:
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          sed -i "s/^VERSION_NAME=.*/VERSION_NAME=${VERSION}/" gradle.properties

      - name: Warm up convention build
        run: ./gradlew :convention:assemble --no-configuration-cache

      # Each released version is archived (without its `older/` directory) in versions/<version>/ of the
      # `dokka-versions` branch: GitHub Pages deployments replace the whole site, so previous versions
      # are rebuilt from this archive by the Dokka versioning plugin.
      - name: Fetch archived KDoc versions
        env:
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if git ls-remote --exit-code --heads origin dokka-versions; then
            git clone --depth 1 --branch dokka-versions "https://github.com/${REPOSITORY}.git" "$RUNNER_TEMP/dokka-versions"
          else
            git init -b dokka-versions "$RUNNER_TEMP/dokka-versions"
          fi
          # Re-running the job for an archived version must not list it as an older version of itself.
          rm -rf "$RUNNER_TEMP/dokka-versions/versions/${TAG#v}"
          mkdir -p "$RUNNER_TEMP/dokka-versions/versions"

      - name: Generate KDoc
        run: ./gradlew dokkaGeneratePublicationHtml --no-configuration-cache "-PdokkaOlderVersionsDir=$RUNNER_TEMP/dokka-versions/versions"

      - name: Archive KDoc version
        env:
          TAG: ${{ needs.release-please.outputs.tag_name || inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARCHIVE="$RUNNER_TEMP/dokka-versions"
          VERSION="${TAG#v}"
          mkdir -p "$ARCHIVE/versions/$VERSION"
          rsync -a --delete --exclude /older build/dokka/html/ "$ARCHIVE/versions/$VERSION/"
          git -C "$ARCHIVE" add versions
          if git -C "$ARCHIVE" diff --cached --quiet; then
            echo "KDoc $VERSION already archived"
            exit 0
          fi
          git -C "$ARCHIVE" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "docs: archive KDoc $VERSION"
          git -C "$ARCHIVE" push "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" HEAD:dokka-versions

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/dokka/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
