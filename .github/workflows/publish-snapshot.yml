name: Publish SNAPSHOT

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1' # Every Monday at 02:00 UTC

concurrency:
  group: publish-snapshot
  cancel-in-progress: false

jobs:
  publish-snapshot:
    name: Publish SNAPSHOT
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: Litote/ci/.github/actions/setup-gradle@5f7a96295fbcd88179faba3ac78685a78b7b6c84 # v0.8.1
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Warm up convention build
        run: ./gradlew :convention:assemble --no-configuration-cache

      - name: Override JVM args
        run: sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8/' gradle.properties

      # Generated clients under client/ are not published (Maven Central publishing limits).
      - uses: Litote/ci/.github/actions/maven-central-publish@5f7a96295fbcd88179faba3ac78685a78b7b6c84 # v0.8.1
        with:
          gradle-args: >
            :openapi:publishToMavenCentral
            :sdk:api:publishToMavenCentral
            :sdk:configuration:publishToMavenCentral
            :sdk:send:publishToMavenCentral
            :sdk:read:publishToMavenCentral
            --max-workers=2
          maven-central-username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          maven-central-password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          signing-key: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          signing-key-id: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          signing-key-password: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
